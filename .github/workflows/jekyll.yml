# Workflow for building and deploying the personal homepage to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
        continue-on-error: true
      - name: Report Pages availability
        id: pages_status
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check rendered personal content
        run: |
          set -e
          for title in \
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" \
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations"; do
            grep -Fq "$title" _site/index.html
            grep -Fq "$title" _site/publications/index.html
          done
          grep -Fq "Academic Background" _site/index.html
          grep -Fq "Research Experience" _site/index.html
          grep -Fq "Skills" _site/index.html
          grep -Fq "jliugi@connect.ust.hk" _site/index.html
          grep -Fq "/LJT-Homepage/assets/css/main.css" _site/index.html
          if grep -Fq "Paper Title Number" _site/index.html _site/publications/index.html; then
            exit 1
          fi
          find _site -name '*.html' -print
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
